name: CI Checks


on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-check:
    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v3

    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Install dependencies
      run: npm install

    - name: Run Markdown Lint
      run: npx markdownlint "**/*.md"

    - name: Run Spell Check
      run: npx cspell "**/*.md"