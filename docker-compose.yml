version: '3.8'

services:

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:

      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=focus_user
      - DB_PASSWORD=focus_password
      - DB_NAME=focus_db
    depends_on:
      - db  
    restart: always

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: focus_user
      POSTGRES_PASSWORD: focus_password
      POSTGRES_DB: focus_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: